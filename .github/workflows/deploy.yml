# Publica la app en GitHub Pages cuando CI termina bien en un cambio a main. A mano (workflow_dispatch) publica
# la rama elegida sin esperar a CI.
# Requisito (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Publica exactamente el commit que CI aprobó, no el último de la rama.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: |
          # Repositorio "usuario.github.io" → sitio en la raíz; cualquier otro → /<repositorio>/.
          # Con dominio propio, define la variable de repositorio BASE_PATH=/ (Settings → Variables).
          NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.BASE_PATH }}" ]; then BASE="${{ vars.BASE_PATH }}";
          elif [[ "$NAME" == *.github.io ]]; then BASE="/";
          else BASE="/$NAME/"; fi
          BASE_PATH="$BASE" npm run build
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
