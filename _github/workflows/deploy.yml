# Publica la app en GitHub Pages en cada cambio a main.
# Requisito (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: |
          # Repositorio "usuario.github.io" → sitio en la raíz; cualquier otro → /<repositorio>/.
          # Con dominio propio, define la variable de repositorio BASE_PATH=/ (Settings → Variables).
          NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.BASE_PATH }}" ]; then BASE="${{ vars.BASE_PATH }}";
          elif [[ "$NAME" == *.github.io ]]; then BASE="/";
          else BASE="/$NAME/"; fi
          BASE_PATH="$BASE" npm run build
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
